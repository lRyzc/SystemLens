[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "systemlens"
version = "1.1.0"
description = "A quiet, local-first system monitor. Python, real metrics, black and gold."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["psutil>=7.0,<8"]

[project.optional-dependencies]
desktop = ["pywebview>=6.2,<7; sys_platform == 'win32'"]

[project.gui-scripts]
systemlens-desktop = "systemlens.desktop:main"

[project.scripts]
systemlens = "systemlens.__main__:main"

[tool.setuptools.package-data]
systemlens = ["static/*"]

[tool.setuptools.packages.find]
include = ["systemlens*"]
